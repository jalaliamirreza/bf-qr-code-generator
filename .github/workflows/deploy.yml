name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Stage only the files the site actually serves. Uploading the repo root
      # would ship node_modules/ (installed above) into the Pages artifact.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html styles.css manifest.json service-worker.js \
             icon.svg icon-maskable.svg _site/
          cp -r dist _site/dist

      # The service worker is cache-first with a hard-coded cache name, so a
      # deploy is invisible to returning visitors until the SW file itself
      # changes. Stamping the commit SHA makes every deploy a new cache.
      - name: Version service worker cache
        run: |
          sed -i "s|^const CACHE_NAME = .*|const CACHE_NAME = \"bf-qr-${GITHUB_SHA}\";|" _site/service-worker.js
          head -1 _site/service-worker.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
